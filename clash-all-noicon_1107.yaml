# ========================
# Clash-ALL 优化配置
# ========================

# 机场节点订阅

proxy-providers:

  sub_mix:
    url: "https://raw.githubusercontent.com/gavinkaihuang/clashini/refs/heads/main/clash_group_u.ini"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

  牛逼机场:
    url: "https://zhuzhuzhu.whtjdasha.com/dazhutou/9b95cb701f1c0d82b9f80417560ac7d8"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

  Cloudflare代理:
      url: "https://llmsh.cc.cd/sub?token=149849bbe939ed54b25c7fe2967f59fa"
      type: http
      interval: 86400
      health-check:
        enable: true
        url: https://www.gstatic.com/generate_204
        interval: 300
      proxy: 直连

  CFAngel代理:
      type: http
      url: "https://green-scene-c052.ddangel-huang.workers.dev/58c1ada6-e4d9-4f5d-a352-ea88db0a1bba/sub"
      path: ./proxy_provider/cf_angel.yaml
      interval: 86400
      proxy: 自建节点
      header:
        User-Agent: ["Clash.Meta"]   # 强制让 Worker 返回 Clash 适用的 YAML 格式
      health-check:
        enable: true
        url: https://www.gstatic.com/generate_204
        interval: 300



